spring.application.name=todo-list

# Porta definida pela plataforma de hospedagem (variável PORT); 8080 localmente
server.port=${PORT:8080}

# Banco H2 em memória (os dados são perdidos ao reiniciar)
spring.datasource.url=jdbc:h2:mem:tododb
spring.datasource.username=sa
spring.datasource.password=
# O schema vem das migrações do Flyway (src/main/resources/db/migration); o Hibernate só confere se bate com as entidades
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Console H2 em http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Swagger UI em http://localhost:8080/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html

# Cookie de sessão: HttpOnly (padrão) e SameSite=Lax
server.servlet.session.cookie.same-site=lax
