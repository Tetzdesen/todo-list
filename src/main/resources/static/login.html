<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Entrar · Tarefas</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">
	<link rel="stylesheet" href="css/styles.css">
	<script src="js/theme.js"></script>
	<script type="module" src="js/login.js"></script>
</head>
<body class="auth-page">
	<header class="auth-header">
		<a href="./" class="brand">
			<span class="brand-mark" aria-hidden="true">
				<svg viewBox="0 0 16 16"><path d="m3.5 8.5 3 3 6-7"/></svg>
			</span>
			Tarefas
		</a>
		<button type="button" class="icon-button theme-toggle" data-theme-toggle>
			<svg class="icon-moon" viewBox="0 0 20 20" aria-hidden="true"><path d="M16.5 12.2A6.8 6.8 0 0 1 7.8 3.5a6.8 6.8 0 1 0 8.7 8.7Z"/></svg>
			<svg class="icon-sun" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.4"/><path d="M10 2v1.8M10 16.2V18M2 10h1.8M16.2 10H18M4.3 4.3l1.3 1.3M14.4 14.4l1.3 1.3M4.3 15.7l1.3-1.3M14.4 5.6l1.3-1.3"/></svg>
		</button>
	</header>

	<main class="auth">
		<div class="card auth-card">
			<!-- painel de entrada -->
			<section id="login-panel" aria-labelledby="login-heading">
				<h1 id="login-heading" class="auth-title">Entrar na sua conta</h1>
				<p class="auth-subtitle">Informe seu e-mail e senha para continuar.</p>
			</section>

			<!-- painel de cadastro -->
			<section id="register-panel" aria-labelledby="register-heading" hidden>
				<h1 id="register-heading" class="auth-title">Criar uma conta</h1>
				<p class="auth-subtitle">Leva menos de um minuto.</p>
			</section>

			<div id="error-banner" class="error-banner" role="alert" hidden>
				<span id="error-message"></span>
				<button type="button" id="error-close" class="button button-ghost button-small" aria-label="Fechar aviso">Fechar</button>
			</div>

			<form id="login-form" class="form" aria-labelledby="login-heading" novalidate>
				<div class="field">
					<label for="login-email" class="label">E-mail</label>
					<input id="login-email" name="email" type="email" class="input" autocomplete="username" placeholder="nome@exemplo.com">
					<p class="field-error" data-error-for="email"></p>
				</div>
				<div class="field">
					<label for="login-password" class="label">Senha</label>
					<input id="login-password" name="password" type="password" class="input" autocomplete="current-password">
					<p class="field-error" data-error-for="password"></p>
				</div>
				<button type="submit" class="button button-primary button-block">Entrar</button>
			</form>

			<form id="register-form" class="form" aria-labelledby="register-heading" novalidate hidden>
				<div class="field">
					<label for="register-name" class="label">Nome</label>
					<input id="register-name" name="name" type="text" class="input" autocomplete="name">
					<p class="field-error" data-error-for="name"></p>
				</div>
				<div class="field">
					<label for="register-email" class="label">E-mail</label>
					<input id="register-email" name="email" type="email" class="input" autocomplete="email" placeholder="nome@exemplo.com">
					<p class="field-error" data-error-for="email"></p>
				</div>
				<div class="field">
					<label for="register-password" class="label">Senha</label>
					<input id="register-password" name="password" type="password" class="input" autocomplete="new-password" aria-describedby="register-password-hint">
					<p id="register-password-hint" class="hint">Use pelo menos 8 caracteres.</p>
					<p class="field-error" data-error-for="password"></p>
				</div>
				<button type="submit" class="button button-primary button-block">Criar conta</button>
			</form>

			<!-- só aparece quando o servidor tem o login com Google configurado -->
			<div id="google-login" hidden>
				<p class="divider"><span>ou</span></p>
				<a href="oauth2/authorization/google" class="button button-block google-button">
					<svg viewBox="0 0 18 18" aria-hidden="true">
						<path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92a8.78 8.78 0 0 0 2.68-6.62Z"/>
						<path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18Z"/>
						<path fill="#FBBC05" d="M3.97 10.72A5.4 5.4 0 0 1 3.68 9c0-.6.1-1.18.29-1.72V4.95H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.05l3.01-2.33Z"/>
						<path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58Z"/>
					</svg>
					Continuar com Google
				</a>
			</div>
		</div>

		<p class="auth-switch" id="switch-to-register">
			Não tem uma conta? <button type="button" class="link-button" data-switch-to="register">Criar conta</button>
		</p>
		<p class="auth-switch" id="switch-to-login" hidden>
			Já tem uma conta? <button type="button" class="link-button" data-switch-to="login">Entrar</button>
		</p>
	</main>

	<footer class="site-footer">
		<a href="swagger-ui.html">Documentação da API</a>
		<span aria-hidden="true">·</span>
		<a href="https://github.com/Tetzdesen/todo-list" target="_blank" rel="noopener">GitHub</a>
	</footer>
</body>
</html>
