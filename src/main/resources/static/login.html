<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Entrar · Tarefas</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
	<link rel="stylesheet" href="css/styles.css">
	<script type="module" src="js/login.js"></script>
</head>
<body class="auth-page">
	<main class="auth">
		<div class="auth-card">
			<h1 class="auth-title">
				<svg class="list-icon icon-completed" viewBox="0 0 20 20" aria-hidden="true">
					<rect x="3" y="3" width="14" height="14" rx="3.5"/>
					<path class="icon-check" d="m6.8 10.2 2.2 2.2 4.2-4.6"/>
				</svg>
				Tarefas
			</h1>

			<div class="auth-tabs" role="tablist" aria-label="Forma de acesso">
				<button type="button" class="auth-tab" role="tab" id="tab-login" aria-controls="login-form" aria-selected="true">Entrar</button>
				<button type="button" class="auth-tab" role="tab" id="tab-register" aria-controls="register-form" aria-selected="false" tabindex="-1">Criar conta</button>
			</div>

			<div id="error-banner" class="error-banner" role="alert" hidden>
				<span id="error-message"></span>
				<button type="button" id="error-close" class="text-button" aria-label="Fechar aviso">Fechar</button>
			</div>

			<form id="login-form" class="auth-form" role="tabpanel" aria-labelledby="tab-login" novalidate>
				<div class="field">
					<label for="login-email" class="auth-label">E-mail</label>
					<input id="login-email" name="email" type="email" class="auth-input" autocomplete="username">
					<p class="field-error" data-error-for="email"></p>
				</div>
				<div class="field">
					<label for="login-password" class="auth-label">Senha</label>
					<input id="login-password" name="password" type="password" class="auth-input" autocomplete="current-password">
					<p class="field-error" data-error-for="password"></p>
				</div>
				<button type="submit" class="primary-button auth-submit">Entrar</button>
			</form>

			<form id="register-form" class="auth-form" role="tabpanel" aria-labelledby="tab-register" novalidate hidden>
				<div class="field">
					<label for="register-name" class="auth-label">Nome</label>
					<input id="register-name" name="name" type="text" class="auth-input" autocomplete="name">
					<p class="field-error" data-error-for="name"></p>
				</div>
				<div class="field">
					<label for="register-email" class="auth-label">E-mail</label>
					<input id="register-email" name="email" type="email" class="auth-input" autocomplete="email">
					<p class="field-error" data-error-for="email"></p>
				</div>
				<div class="field">
					<label for="register-password" class="auth-label">Senha</label>
					<input id="register-password" name="password" type="password" class="auth-input" autocomplete="new-password" aria-describedby="register-password-hint">
					<p id="register-password-hint" class="auth-hint">Pelo menos 8 caracteres.</p>
					<p class="field-error" data-error-for="password"></p>
				</div>
				<button type="submit" class="primary-button auth-submit">Criar conta</button>
			</form>

			<!-- só aparece quando o servidor tem o login com Google configurado -->
			<div id="google-login" class="auth-google" hidden>
				<p class="auth-divider"><span>ou</span></p>
				<a href="oauth2/authorization/google" class="google-button">
					<svg viewBox="0 0 18 18" aria-hidden="true">
						<path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92a8.78 8.78 0 0 0 2.68-6.62Z"/>
						<path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18Z"/>
						<path fill="#FBBC05" d="M3.97 10.72A5.4 5.4 0 0 1 3.68 9c0-.6.1-1.18.29-1.72V4.95H.96A9 9 0 0 0 0 9c0 1.45.35 2.83.96 4.05l3.01-2.33Z"/>
						<path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58Z"/>
					</svg>
					Entrar com Google
				</a>
			</div>
		</div>

		<footer class="auth-footer">
			<a href="swagger-ui.html">API (Swagger)</a>
			<a href="https://github.com/Tetzdesen/todo-list" target="_blank" rel="noopener">GitHub</a>
		</footer>
	</main>
</body>
</html>
