<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Tarefas</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
	<link rel="stylesheet" href="css/styles.css">
	<script type="module" src="js/app.js"></script>
</head>
<body>
	<div class="shell">
		<aside class="rail">
			<h1 class="brand">
				<svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
					<rect width="24" height="24" rx="7"/>
					<path d="M7 12.5l3.2 3.2L17 8.8"/>
				</svg>
				Tarefas
			</h1>

			<p class="dateblock">
				<span id="day" class="day"></span>
				<span class="dateblock-text">
					<span id="month" class="month"></span>
					<span id="weekday" class="weekday"></span>
				</span>
			</p>

			<div class="progress">
				<p id="progress-label" class="progress-label" aria-live="polite"></p>
				<div id="tally" class="tally" aria-hidden="true"></div>
			</div>

			<nav class="filters" aria-label="Filtrar tarefas">
				<button type="button" class="filter" data-filter="all" aria-pressed="true">Todas <span class="filter-count" data-count-for="all"></span></button>
				<button type="button" class="filter" data-filter="pending" aria-pressed="false">Pendentes <span class="filter-count" data-count-for="pending"></span></button>
				<button type="button" class="filter" data-filter="completed" aria-pressed="false">Feitas <span class="filter-count" data-count-for="completed"></span></button>
			</nav>

			<footer class="rail-footer">
				<p class="rail-hint"><kbd>N</kbd> nova tarefa · <kbd>Esc</kbd> cancela</p>
				<nav class="rail-links" aria-label="Sobre o projeto">
					<a href="swagger-ui.html">Documentação da API</a>
					<a href="https://github.com/Tetzdesen/todo-list" target="_blank" rel="noopener">Código no GitHub</a>
				</nav>
			</footer>
		</aside>

		<main class="board">
			<header class="board-header">
				<h2 id="greeting" class="greeting"></h2>
				<p id="summary" class="summary"></p>
			</header>

			<div id="error-banner" class="error-banner" role="alert" hidden>
				<span id="error-message"></span>
				<button type="button" id="error-close" class="link-button" aria-label="Fechar aviso">fechar</button>
			</div>

			<form id="create-form" class="composer" novalidate>
				<h2 class="visually-hidden">Nova tarefa</h2>
				<span class="composer-mark" aria-hidden="true">
					<svg viewBox="0 0 20 20"><path d="M10 4v12M4 10h12"/></svg>
				</span>
				<div class="composer-body">
					<div class="field">
						<label for="create-title" class="visually-hidden">Título</label>
						<input id="create-title" name="title" type="text" class="composer-title" autocomplete="off" placeholder="Adicionar uma tarefa">
						<p class="field-error" data-error-for="title"></p>
					</div>
					<div class="composer-extra">
						<div class="composer-extra-inner">
							<div class="field">
								<label for="create-description" class="visually-hidden">Descrição (opcional)</label>
								<textarea id="create-description" name="description" rows="1" class="composer-description" placeholder="Anotação (opcional)"></textarea>
								<p class="field-error" data-error-for="description"></p>
							</div>
							<div class="composer-footer">
								<span class="hint"><kbd>Enter</kbd> no título já adiciona</span>
								<button type="submit" class="primary-button">Adicionar</button>
							</div>
						</div>
					</div>
				</div>
			</form>

			<section class="group" aria-labelledby="list-heading">
				<h2 id="list-heading" class="visually-hidden">Lista de tarefas</h2>
				<ul id="todo-list" class="todo-list"></ul>
				<p id="empty-message" class="empty-message" hidden></p>
			</section>

			<section id="done-section" class="group done-section" aria-labelledby="done-heading" hidden>
				<h2 id="done-heading" class="group-heading">Feitas</h2>
				<ul id="done-list" class="todo-list"></ul>
			</section>
		</main>
	</div>

	<template id="todo-template">
		<li class="todo" data-mode="view">
			<div class="todo-view">
				<label class="check">
					<input type="checkbox" class="todo-toggle">
					<svg class="check-mark" viewBox="0 0 20 20" aria-hidden="true">
						<path d="M5.5 10.4l3 3 6-6.6"/>
					</svg>
				</label>
				<div class="todo-content">
					<p class="todo-title"></p>
					<p class="todo-description"></p>
				</div>
				<div class="todo-meta">
					<time class="todo-date"></time>
					<div class="todo-actions">
						<button type="button" class="link-button" data-action="edit">editar</button>
						<button type="button" class="link-button danger" data-action="delete">apagar</button>
					</div>
				</div>
			</div>

			<form class="todo-edit" novalidate>
				<div class="field">
					<label>
						<span class="visually-hidden">Título</span>
						<input name="title" type="text" class="edit-title" autocomplete="off">
					</label>
					<p class="field-error" data-error-for="title"></p>
				</div>
				<div class="field">
					<label>
						<span class="visually-hidden">Descrição</span>
						<textarea name="description" rows="2" class="edit-description" placeholder="Anotação (opcional)"></textarea>
					</label>
					<p class="field-error" data-error-for="description"></p>
				</div>
				<div class="todo-actions always">
					<button type="submit" class="primary-button small">Salvar</button>
					<button type="button" class="link-button" data-action="cancel-edit">cancelar</button>
				</div>
			</form>

			<div class="todo-confirm">
				<p>Apagar “<span class="todo-confirm-title"></span>”? Não dá pra desfazer.</p>
				<div class="todo-actions always">
					<button type="button" class="primary-button small danger" data-action="confirm-delete">Apagar</button>
					<button type="button" class="link-button" data-action="cancel-delete">manter</button>
				</div>
			</div>
		</li>
	</template>
</body>
</html>
