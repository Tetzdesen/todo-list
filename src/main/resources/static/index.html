<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Tarefas</title>
	<link rel="stylesheet" href="css/styles.css">
	<script src="js/theme.js"></script>
	<script type="module" src="js/app.js"></script>
</head>
<body>
	<!-- só aparece depois que app.js confirma a sessão -->
	<div class="page" hidden>
		<header class="topbar">
			<div class="topbar-inner">
				<a href="./" class="brand">Tarefas</a>
				<div class="topbar-actions">
					<span id="account-name" class="account-name"></span>
					<button type="button" class="button button-small" data-theme-toggle>Modo noturno</button>
					<button type="button" id="logout" class="button button-small">Sair</button>
				</div>
			</div>
		</header>

		<main class="container">
			<h1 class="page-title">Minhas tarefas</h1>

			<div id="error-banner" class="error-banner" role="alert" hidden>
				<span id="error-message"></span>
				<button type="button" id="error-close" class="link-button" aria-label="Fechar aviso">Fechar</button>
			</div>

			<section class="panel" aria-labelledby="create-heading">
				<h2 id="create-heading" class="panel-heading">Nova tarefa</h2>
				<form id="create-form" class="panel-body form" novalidate>
					<div class="field">
						<label for="create-title" class="label">Título</label>
						<input id="create-title" name="title" type="text" class="input" autocomplete="off">
						<p class="field-error" data-error-for="title"></p>
					</div>
					<div class="field">
						<label for="create-description" class="label">Notas <span class="optional">(opcional)</span></label>
						<textarea id="create-description" name="description" rows="2" class="input"></textarea>
						<p class="field-error" data-error-for="description"></p>
					</div>
					<div class="form-actions">
						<button type="submit" class="button button-primary">Adicionar</button>
					</div>
				</form>
			</section>

			<section class="panel" aria-labelledby="list-heading">
				<div class="panel-heading panel-heading-tabs">
					<h2 id="list-heading" class="visually-hidden">Lista de tarefas</h2>
					<nav class="tabs" aria-label="Filtrar tarefas">
						<button type="button" class="tab filter" data-filter="all" aria-pressed="true">
							Todas <span class="count" data-count-for="all"></span>
						</button>
						<button type="button" class="tab filter" data-filter="pending" aria-pressed="false">
							Pendentes <span class="count" data-count-for="pending"></span>
						</button>
						<button type="button" class="tab filter" data-filter="completed" aria-pressed="false">
							Feitas <span class="count" data-count-for="completed"></span>
						</button>
					</nav>
				</div>
				<ul id="todo-list" class="todo-list"></ul>
				<p id="empty-message" class="empty-message" hidden></p>
			</section>
		</main>

		<footer class="site-footer">
			<a href="swagger-ui.html">API (Swagger)</a>
			<a href="https://github.com/Tetzdesen/todo-list" target="_blank" rel="noopener">GitHub</a>
		</footer>
	</div>

	<template id="todo-template">
		<li class="todo" data-mode="view">
			<div class="todo-view">
				<input type="checkbox" class="todo-toggle">
				<div class="todo-body">
					<span class="todo-title"></span>
					<p class="todo-description"></p>
					<span class="todo-created"></span>
				</div>
				<div class="todo-actions">
					<button type="button" class="link-button" data-action="edit">Editar</button>
					<button type="button" class="link-button link-danger" data-action="delete">Excluir</button>
				</div>
			</div>

			<form class="todo-edit form" novalidate>
				<div class="field">
					<label>
						<span class="label">Título</span>
						<input name="title" type="text" class="input" autocomplete="off">
					</label>
					<p class="field-error" data-error-for="title"></p>
				</div>
				<div class="field">
					<label>
						<span class="label">Notas</span>
						<textarea name="description" rows="2" class="input"></textarea>
					</label>
					<p class="field-error" data-error-for="description"></p>
				</div>
				<div class="form-actions">
					<button type="button" class="button" data-action="cancel-edit">Cancelar</button>
					<button type="submit" class="button button-primary">Salvar</button>
				</div>
			</form>

			<div class="todo-confirm">
				<p>Excluir a tarefa “<span class="todo-confirm-title"></span>”?</p>
				<div class="form-actions">
					<button type="button" class="button" data-action="cancel-delete">Cancelar</button>
					<button type="button" class="button button-danger" data-action="confirm-delete">Excluir</button>
				</div>
			</div>
		</li>
	</template>
</body>
</html>
