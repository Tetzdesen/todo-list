# Perfil de produção: ative com SPRING_PROFILES_ACTIVE=prod

# PostgreSQL (dados de conexão vêm das variáveis de ambiente)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# O banco de produção já existia antes do Flyway, com o schema criado pelo Hibernate: na primeira execução ele é
# marcado como versão 1 (a V1 não roda) e as migrações seguintes são aplicadas normalmente
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Console H2 desligado em produção
spring.h2.console.enabled=false

# O Render termina o HTTPS e repassa em HTTP: os cabeçalhos X-Forwarded-* fazem o Spring montar URLs https
# (necessário para o redirect_uri do login com Google)
server.forward-headers-strategy=framework

# Cookie de sessão só por HTTPS
server.servlet.session.cookie.secure=true
