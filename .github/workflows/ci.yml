name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # roda todos os testes, inclusive o PostgresIntegrationTest (o runner do GitHub já tem Docker)
      - name: Build e testes
        run: ./mvnw -B verify

      # ---------- Testes de ponta a ponta da interface (Playwright) ----------

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Instala o Playwright e o Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # o Playwright sobe o jar gerado pelo verify (H2 em memória) e roda os testes contra ele
      - name: Testes de ponta a ponta
        working-directory: e2e
        env:
          E2E_SERVER_COMMAND: java -jar ../target/todo-list-0.0.1-SNAPSHOT.jar
        run: npx playwright test

      # em caso de falha, o relatório (com capturas de tela e traces) fica disponível para download na execução
      - name: Guarda o relatório dos testes de ponta a ponta
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-playwright
          path: e2e/playwright-report/
          retention-days: 7
